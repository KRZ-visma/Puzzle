name: Stamp version on main

# Generates version.json whenever changes land on main (e.g. after a PR merge).
# Also bumps CACHE_VERSION inside sw.js so browsers detect a new service worker.

on:
  push:
    branches: [main]

concurrency:
  group: stamp-version-main
  cancel-in-progress: false

jobs:
  stamp-version:
    if: >-
      github.event.head_commit &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate version stamp
        id: version
        env:
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          DATE="$(date -u +%Y.%m.%d)"
          VERSION="${DATE}.${RUN}"
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export VERSION SHORT_SHA GENERATED_AT

          python3 <<'PY'
          import json, os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          payload = {
              "version": version,
              "sha": os.environ["SHORT_SHA"],
              "generatedAt": os.environ["GENERATED_AT"],
              "channel": "main",
          }
          Path("version.json").write_text(json.dumps(payload, indent=2) + "\n")

          path = Path("sw.js")
          text = path.read_text()
          text, n1 = re.subn(
              r"/\* CACHE_VERSION: .*? \*/",
              f"/* CACHE_VERSION: {version} */",
              text,
              count=1,
          )
          text, n2 = re.subn(
              r'const CACHE_VERSION = ".*?";',
              f'const CACHE_VERSION = "{version}";',
              text,
              count=1,
          )
          if n1 < 1 or n2 < 1:
              raise SystemExit("Failed to patch CACHE_VERSION in sw.js")
          path.write_text(text)
          print(json.dumps(payload, indent=2))
          PY

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and push version stamp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json sw.js
          if git diff --staged --quiet; then
            echo "Version stamp unchanged"
            exit 0
          fi
          git commit -m "chore: stamp version ${VERSION} [skip ci]"
          git push
