<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="853" viewBox="0 0 1280 853">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8E4FF"/>
      <stop offset="55%" stop-color="#E7F6FF"/>
      <stop offset="100%" stop-color="#FFF4D6"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#7BC8A4"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F0A8"/>
      <stop offset="100%" stop-color="#8FD36A"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="100%" stop-color="#F0C75E"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="853" fill="url(#sky)"/>

  <!-- Soft sun -->
  <circle cx="980" cy="160" r="78" fill="#FFE66D" stroke="#FFD93D" stroke-width="6"/>
  <circle cx="980" cy="160" r="58" fill="#FFF3A1"/>
  <!-- simple smile -->
  <circle cx="955" cy="150" r="7" fill="#5C4B2A"/>
  <circle cx="1005" cy="150" r="7" fill="#5C4B2A"/>
  <path d="M950 180 Q980 205 1010 180" fill="none" stroke="#5C4B2A" stroke-width="5" stroke-linecap="round"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="220" cy="140" rx="70" ry="38"/>
    <ellipse cx="270" cy="130" rx="55" ry="42"/>
    <ellipse cx="310" cy="148" rx="48" ry="30"/>
    <ellipse cx="520" cy="100" rx="60" ry="32"/>
    <ellipse cx="560" cy="90" rx="50" ry="36"/>
    <ellipse cx="600" cy="105" rx="42" ry="26"/>
    <ellipse cx="1140" cy="220" rx="55" ry="30"/>
    <ellipse cx="1180" cy="210" rx="42" ry="28"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 470 C160 390 280 410 420 450 C560 490 700 380 860 420 C1000 455 1120 400 1280 430 L1280 853 L0 853 Z" fill="url(#hillBack)"/>

  <!-- Trees on mid ridge -->
  <g>
    <ellipse cx="180" cy="430" rx="28" ry="46" fill="#6FBF8C"/>
    <rect x="174" y="465" width="12" height="28" rx="3" fill="#C48A5A"/>
    <ellipse cx="320" cy="455" rx="34" ry="52" fill="#5EAF7A"/>
    <rect x="314" y="495" width="12" height="30" rx="3" fill="#C48A5A"/>
    <ellipse cx="760" cy="430" rx="30" ry="48" fill="#6FBF8C"/>
    <rect x="754" y="465" width="12" height="28" rx="3" fill="#C48A5A"/>
    <ellipse cx="1080" cy="445" rx="36" ry="54" fill="#5EAF7A"/>
    <rect x="1074" y="485" width="12" height="32" rx="3" fill="#C48A5A"/>
  </g>

  <!-- Mid hills -->
  <path d="M0 560 C180 500 320 530 480 560 C640 590 780 500 960 540 C1100 570 1200 530 1280 550 L1280 853 L0 853 Z" fill="url(#hillMid)"/>

  <!-- Cartoon cottage -->
  <g>
    <rect x="560" y="520" width="120" height="80" rx="6" fill="#FFE8D6" stroke="#E8BFA8" stroke-width="4"/>
    <polygon points="540,525 620,455 700,525" fill="#FF8A80" stroke="#E57373" stroke-width="4"/>
    <rect x="600" y="545" width="40" height="55" rx="4" fill="#F4A261" stroke="#E08E4F" stroke-width="3"/>
    <rect x="575" y="545" width="28" height="28" rx="4" fill="#A8D8FF" stroke="#7EB8E8" stroke-width="3"/>
    <rect x="640" y="545" width="28" height="28" rx="4" fill="#A8D8FF" stroke="#7EB8E8" stroke-width="3"/>
    <!-- chimney -->
    <rect x="655" y="470" width="18" height="36" rx="3" fill="#E8BFA8"/>
    <ellipse cx="664" cy="458" rx="10" ry="6" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="670" cy="445" rx="12" ry="7" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Front hill -->
  <path d="M0 680 C200 620 360 660 520 690 C700 725 860 640 1040 680 C1140 705 1220 690 1280 700 L1280 853 L0 853 Z" fill="url(#hillFront)"/>

  <!-- Flowers -->
  <g>
    <circle cx="140" cy="740" r="12" fill="#FF9EC8"/>
    <circle cx="140" cy="740" r="4" fill="#FFE66D"/>
    <circle cx="210" cy="770" r="11" fill="#C9B6FF"/>
    <circle cx="210" cy="770" r="4" fill="#FFE66D"/>
    <circle cx="300" cy="750" r="12" fill="#FFB4A2"/>
    <circle cx="300" cy="750" r="4" fill="#FFE66D"/>
    <circle cx="900" cy="760" r="12" fill="#FF9EC8"/>
    <circle cx="900" cy="760" r="4" fill="#FFE66D"/>
    <circle cx="980" cy="735" r="11" fill="#A8D8FF"/>
    <circle cx="980" cy="735" r="4" fill="#FFE66D"/>
    <circle cx="1100" cy="770" r="12" fill="#C9B6FF"/>
    <circle cx="1100" cy="770" r="4" fill="#FFE66D"/>
    <circle cx="1180" cy="745" r="10" fill="#FFB4A2"/>
    <circle cx="1180" cy="745" r="3.5" fill="#FFE66D"/>
  </g>

  <!-- Path -->
  <path d="M620 853 C640 800 650 760 655 720 C660 680 650 640 620 600" fill="none" stroke="#F6E2B3" stroke-width="34" stroke-linecap="round"/>
  <path d="M620 853 C640 800 650 760 655 720 C660 680 650 640 620 600" fill="none" stroke="#F0D59A" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
</svg>
