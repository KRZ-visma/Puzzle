<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5a9e4b" />
    <meta name="description" content="Free-form interlocking jigsaw puzzle PWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Puzzle" />
    <title>Puzzle</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <header class="chrome-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Puzzle</h1>
      </div>
      <div class="menu-wrap">
        <button
          type="button"
          id="menu-toggle"
          class="menu-toggle"
          data-testid="menu-toggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="app-menu"
        >
          <span class="menu-toggle-bars" aria-hidden="true"></span>
        </button>
        <div id="app-menu" class="app-menu" hidden data-testid="app-menu" role="menu">
          <button type="button" id="restart-btn" class="app-menu-item" data-testid="restart" role="menuitem">
            Restart
          </button>
          <button type="button" id="preview-btn" class="app-menu-item" data-testid="preview" role="menuitem">
            Preview
          </button>
          <div class="app-menu-section" role="group" aria-label="Difficulty options">
            <p class="app-menu-section-label">Harder</p>
            <button
              type="button"
              id="toggle-hide-background"
              class="app-menu-item app-menu-toggle"
              data-testid="toggle-hide-background"
              role="menuitemcheckbox"
              aria-checked="false"
            >
              <span class="app-menu-toggle-label">Hide background image</span>
              <span class="app-menu-toggle-state" data-testid="toggle-hide-background-state">Off</span>
            </button>
            <button
              type="button"
              id="toggle-precise-snap"
              class="app-menu-item app-menu-toggle"
              data-testid="toggle-precise-snap"
              role="menuitemcheckbox"
              aria-checked="false"
            >
              <span class="app-menu-toggle-label">Precise snap</span>
              <span class="app-menu-toggle-state" data-testid="toggle-precise-snap-state">Off</span>
            </button>
            <button
              type="button"
              id="toggle-disable-preview"
              class="app-menu-item app-menu-toggle"
              data-testid="toggle-disable-preview"
              role="menuitemcheckbox"
              aria-checked="false"
            >
              <span class="app-menu-toggle-label">Disable preview</span>
              <span class="app-menu-toggle-state" data-testid="toggle-disable-preview-state">Off</span>
            </button>
          </div>
          <p class="app-menu-version version-label">
            Version <code id="app-version" data-testid="app-version">…</code>
          </p>
        </div>
      </div>
    </header>

    <main class="stage stage-playfield">
      <section class="playfield-panel" aria-label="Jigsaw playfield">
        <p id="status" class="status visually-hidden" data-testid="status" aria-live="polite"></p>
        <canvas
          id="playfield"
          class="playfield"
          data-testid="playfield"
          role="img"
          aria-label="Jigsaw puzzle playfield"
        ></canvas>
        <button
          type="button"
          id="clear-area-btn"
          class="playfield-btn clear-area-btn"
          data-testid="clear-area"
          aria-label="Clear puzzle area"
          title="Clear puzzle area"
        >
          <svg class="playfield-btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect
              x="7"
              y="7"
              width="10"
              height="10"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-dasharray="2.5 2"
            />
            <path
              d="M12 3.25v3.5M12 17.25v3.5M3.25 12h3.5M17.25 12h3.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
            />
            <path
              d="M12 3.25 10.25 5M12 3.25 13.75 5M12 20.75 10.25 19M12 20.75 13.75 19M3.25 12 5 10.25M3.25 12 5 13.75M20.75 12 19 10.25M20.75 12 19 13.75"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div id="zoom-controls" class="zoom-controls" role="group" aria-label="Zoom" data-testid="zoom-controls">
          <button type="button" id="zoom-out-btn" class="zoom-btn" data-testid="zoom-out" aria-label="Zoom out">
            −
          </button>
          <button type="button" id="zoom-reset-btn" class="zoom-btn zoom-btn-reset" data-testid="zoom-reset" aria-label="Reset zoom">
            100%
          </button>
          <button type="button" id="zoom-in-btn" class="zoom-btn" data-testid="zoom-in" aria-label="Zoom in">
            +
          </button>
        </div>
      </section>
    </main>

    <div id="update-banner" class="update-banner" hidden role="status" aria-live="polite" data-testid="update-banner">
      <p>A new version is available.</p>
      <button type="button" id="reload-update" class="btn btn-primary" data-testid="reload-update">Update</button>
    </div>

    <div id="preview-modal" class="modal" hidden data-testid="preview-modal">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <div class="modal-header">
          <h2 id="preview-title">Preview</h2>
          <button type="button" id="close-preview" class="btn btn-ghost" aria-label="Close preview">
            Close
          </button>
        </div>
        <img
          src="assets/gallery/woods.jpg"
          alt="Completed puzzle preview"
          class="preview-image"
          data-testid="preview-image"
        />
      </div>
    </div>

    <div id="win-modal" class="modal" hidden data-testid="win-modal">
      <div class="modal-card win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <h2 id="win-title">Puzzle complete!</h2>
        <p>Every piece is in place. Nice work.</p>
        <button type="button" id="play-again" class="btn btn-primary" data-testid="play-again">Play again</button>
      </div>
    </div>

    <div id="start-modal" class="modal" data-testid="start-modal">
      <div class="modal-card start-card" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <h2 id="start-title">Start a puzzle</h2>
        <p class="start-lead" data-testid="start-lead">
          Pick an image, piece count, and how pieces start — then drag them to connect tabs and snap groups onto the board outline.
        </p>
        <div class="gallery-section">
          <p class="gallery-label" id="gallery-label">Puzzle image</p>
          <div
            class="gallery-options"
            role="radiogroup"
            aria-labelledby="gallery-label"
            data-testid="gallery-options"
          >
            <button
              type="button"
              class="gallery-option"
              data-image-id="woods"
              data-testid="gallery-option-woods"
              aria-pressed="true"
            >
              <img src="assets/gallery/woods.jpg" alt="" />
              <span class="gallery-option-title">Mountain woods</span>
            </button>
            <button
              type="button"
              class="gallery-option"
              data-image-id="village"
              data-testid="gallery-option-village"
              aria-pressed="false"
            >
              <img src="assets/gallery/village.jpg" alt="" />
              <span class="gallery-option-title">Alpine village</span>
            </button>
            <button
              type="button"
              class="gallery-option"
              data-image-id="waterfall"
              data-testid="gallery-option-waterfall"
              aria-pressed="false"
            >
              <img src="assets/gallery/waterfall.jpg" alt="" />
              <span class="gallery-option-title">Wooded waterfall</span>
            </button>
            <button
              type="button"
              class="gallery-option"
              data-image-id="forest"
              data-testid="gallery-option-forest"
              aria-pressed="false"
            >
              <img src="assets/gallery/forest.jpg" alt="" />
              <span class="gallery-option-title">Forest skyline</span>
            </button>
          </div>
        </div>
        <div
          class="piece-options"
          role="radiogroup"
          aria-label="Number of pieces"
          data-testid="piece-options"
        >
          <button
            type="button"
            class="piece-option"
            data-pieces="12"
            data-testid="piece-option-12"
            aria-pressed="false"
          >
            <span class="piece-option-count">12</span>
            <span class="piece-option-grid">4×3</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="48"
            data-testid="piece-option-48"
            aria-pressed="false"
          >
            <span class="piece-option-count">48</span>
            <span class="piece-option-grid">8×6</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="100"
            data-testid="piece-option-100"
            aria-pressed="false"
          >
            <span class="piece-option-count">100</span>
            <span class="piece-option-grid">12×8</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="500"
            data-testid="piece-option-500"
            aria-pressed="false"
          >
            <span class="piece-option-count">500</span>
            <span class="piece-option-grid">25×20</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="1000"
            data-testid="piece-option-1000"
            aria-pressed="false"
          >
            <span class="piece-option-count">1000</span>
            <span class="piece-option-grid">40×25</span>
          </button>
        </div>
        <div class="layout-section">
          <p class="layout-label" id="layout-label">Piece layout</p>
          <div
            class="layout-options"
            role="radiogroup"
            aria-labelledby="layout-label"
            data-testid="layout-options"
          >
            <button
              type="button"
              class="layout-option"
              data-layout="scatter"
              data-testid="layout-option-scatter"
              aria-pressed="true"
            >
              <span class="layout-option-title">All over the place</span>
              <span class="layout-option-hint">Scattered around the board</span>
            </button>
            <button
              type="button"
              class="layout-option"
              data-layout="sideTrays"
              data-testid="layout-option-sideTrays"
              aria-pressed="false"
            >
              <span class="layout-option-title">Side trays</span>
              <span class="layout-option-hint">Left and right trays</span>
            </button>
            <button
              type="button"
              class="layout-option"
              data-layout="baskets"
              data-testid="layout-option-baskets"
              aria-pressed="false"
            >
              <span class="layout-option-title">Baskets</span>
              <span class="layout-option-hint">Corner baskets for piles</span>
            </button>
          </div>
        </div>
        <button type="button" id="start-btn" class="btn btn-primary start-btn" data-testid="start-puzzle">
          Start puzzle
        </button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
