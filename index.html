<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5a9e4b" />
    <meta name="description" content="Free-form interlocking jigsaw puzzle PWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Puzzle" />
    <title>Puzzle</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Puzzle</h1>
      </div>
      <div class="controls">
        <label class="control">
          <span>Pieces</span>
          <select id="difficulty" data-testid="difficulty" aria-label="Number of pieces">
            <option value="12">12 (4×3)</option>
            <option value="48">48 (8×6)</option>
            <option value="100" selected>100 (12×8)</option>
            <option value="500">500 (25×20)</option>
            <option value="1000">1000 (40×25)</option>
          </select>
        </label>
        <button type="button" id="shuffle-btn" class="btn btn-secondary" data-testid="shuffle">
          Shuffle
        </button>
        <button type="button" id="preview-btn" class="btn btn-ghost" data-testid="preview">
          Preview
        </button>
      </div>
    </header>

    <main class="stage stage-playfield">
      <section class="playfield-panel" aria-label="Jigsaw playfield">
        <div class="status-row">
          <p id="status" class="status" data-testid="status">Drag pieces to connect tabs.</p>
          <p class="progress" aria-live="polite" data-testid="progress">
            <span id="placed-count">0</span>/<span id="total-count">0</span>
            <span class="groups-label">· <span id="group-count" data-testid="group-count">0</span> groups</span>
          </p>
        </div>
        <canvas
          id="playfield"
          class="playfield"
          data-testid="playfield"
          role="img"
          aria-label="Jigsaw puzzle playfield"
        ></canvas>
      </section>
    </main>

    <footer class="app-footer">
      <p class="version-label">
        Version <code id="app-version" data-testid="app-version">…</code>
      </p>
    </footer>

    <div id="update-banner" class="update-banner" hidden role="status" aria-live="polite" data-testid="update-banner">
      <p>A new version is available.</p>
      <button type="button" id="reload-update" class="btn btn-primary" data-testid="reload-update">Update</button>
    </div>

    <div id="preview-modal" class="modal" hidden data-testid="preview-modal">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <div class="modal-header">
          <h2 id="preview-title">Preview</h2>
          <button type="button" id="close-preview" class="btn btn-ghost" aria-label="Close preview">
            Close
          </button>
        </div>
        <img src="assets/puzzle.jpg" alt="Completed puzzle preview" class="preview-image" />
      </div>
    </div>

    <div id="win-modal" class="modal" hidden data-testid="win-modal">
      <div class="modal-card win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <h2 id="win-title">Puzzle complete!</h2>
        <p>Every piece is in place. Nice work.</p>
        <button type="button" id="play-again" class="btn btn-primary" data-testid="play-again">Play again</button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
