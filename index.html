<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5a9e4b" />
    <meta name="description" content="Free-form interlocking jigsaw puzzle PWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Puzzle" />
    <title>Puzzle</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <header class="chrome-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Puzzle</h1>
      </div>
      <div class="menu-wrap">
        <button
          type="button"
          id="menu-toggle"
          class="menu-toggle"
          data-testid="menu-toggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="app-menu"
        >
          <span class="menu-toggle-bars" aria-hidden="true"></span>
        </button>
        <div id="app-menu" class="app-menu" hidden data-testid="app-menu" role="menu">
          <button type="button" id="restart-btn" class="app-menu-item" data-testid="restart" role="menuitem">
            Restart
          </button>
          <button type="button" id="preview-btn" class="app-menu-item" data-testid="preview" role="menuitem">
            Preview
          </button>
          <div class="app-menu-section" role="group" aria-label="Difficulty options">
            <p class="app-menu-section-label">Harder</p>
            <button
              type="button"
              id="toggle-hide-background"
              class="app-menu-item app-menu-toggle"
              data-testid="toggle-hide-background"
              role="menuitemcheckbox"
              aria-checked="false"
            >
              <span class="app-menu-toggle-label">Hide background image</span>
              <span class="app-menu-toggle-state" data-testid="toggle-hide-background-state">Off</span>
            </button>
            <button
              type="button"
              id="toggle-precise-snap"
              class="app-menu-item app-menu-toggle"
              data-testid="toggle-precise-snap"
              role="menuitemcheckbox"
              aria-checked="false"
            >
              <span class="app-menu-toggle-label">Precise snap</span>
              <span class="app-menu-toggle-state" data-testid="toggle-precise-snap-state">Off</span>
            </button>
            <button
              type="button"
              id="toggle-disable-preview"
              class="app-menu-item app-menu-toggle"
              data-testid="toggle-disable-preview"
              role="menuitemcheckbox"
              aria-checked="false"
            >
              <span class="app-menu-toggle-label">Disable preview</span>
              <span class="app-menu-toggle-state" data-testid="toggle-disable-preview-state">Off</span>
            </button>
          </div>
          <p class="app-menu-version version-label">
            Version <code id="app-version" data-testid="app-version">…</code>
          </p>
        </div>
      </div>
    </header>

    <main class="stage stage-playfield">
      <section class="playfield-panel" aria-label="Jigsaw playfield">
        <p id="status" class="status visually-hidden" data-testid="status" aria-live="polite"></p>
        <canvas
          id="playfield"
          class="playfield"
          data-testid="playfield"
          role="img"
          aria-label="Jigsaw puzzle playfield"
        ></canvas>
      </section>
    </main>

    <div id="update-banner" class="update-banner" hidden role="status" aria-live="polite" data-testid="update-banner">
      <p>A new version is available.</p>
      <button type="button" id="reload-update" class="btn btn-primary" data-testid="reload-update">Update</button>
    </div>

    <div id="preview-modal" class="modal" hidden data-testid="preview-modal">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <div class="modal-header">
          <h2 id="preview-title">Preview</h2>
          <button type="button" id="close-preview" class="btn btn-ghost" aria-label="Close preview">
            Close
          </button>
        </div>
        <img src="assets/puzzle.jpg" alt="Completed puzzle preview" class="preview-image" />
      </div>
    </div>

    <div id="win-modal" class="modal" hidden data-testid="win-modal">
      <div class="modal-card win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <h2 id="win-title">Puzzle complete!</h2>
        <p>Every piece is in place. Nice work.</p>
        <button type="button" id="play-again" class="btn btn-primary" data-testid="play-again">Play again</button>
      </div>
    </div>

    <div id="start-modal" class="modal" data-testid="start-modal">
      <div class="modal-card start-card" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <h2 id="start-title">Start a puzzle</h2>
        <p class="start-lead" data-testid="start-lead">
          Choose how many pieces, then drag them to connect tabs and snap groups onto the board outline.
        </p>
        <div
          class="piece-options"
          role="radiogroup"
          aria-label="Number of pieces"
          data-testid="piece-options"
        >
          <button
            type="button"
            class="piece-option"
            data-pieces="12"
            data-testid="piece-option-12"
            aria-pressed="false"
          >
            <span class="piece-option-count">12</span>
            <span class="piece-option-grid">4×3</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="48"
            data-testid="piece-option-48"
            aria-pressed="false"
          >
            <span class="piece-option-count">48</span>
            <span class="piece-option-grid">8×6</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="100"
            data-testid="piece-option-100"
            aria-pressed="false"
          >
            <span class="piece-option-count">100</span>
            <span class="piece-option-grid">12×8</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="500"
            data-testid="piece-option-500"
            aria-pressed="false"
          >
            <span class="piece-option-count">500</span>
            <span class="piece-option-grid">25×20</span>
          </button>
          <button
            type="button"
            class="piece-option"
            data-pieces="1000"
            data-testid="piece-option-1000"
            aria-pressed="false"
          >
            <span class="piece-option-count">1000</span>
            <span class="piece-option-grid">40×25</span>
          </button>
        </div>
        <button type="button" id="start-btn" class="btn btn-primary start-btn" data-testid="start-puzzle">
          Start puzzle
        </button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
